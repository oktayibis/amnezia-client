name: Release

# Pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) builds signed
# installers and publishes them as a GitHub Release. Tags with a suffix (v1.2.0-beta.1)
# are published as pre-releases.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android (phone + TV)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AmneziaAndroid
    steps:
      - uses: actions/checkout@v4
        with:
          # The AmneziaWG engine is built from Vendor/amneziawg-android and its own submodules.
          submodules: recursive

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]} MINOR=${BASH_REMATCH[2]} PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error::Minor and patch must be <= 999 to fit the versionCode scheme"
            exit 1
          fi
          # Monotonic Play-compatible code: 1.2.3 -> 1002003. Pre-releases share their
          # base version's code, so only one of them can ever be uploaded to a store.
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test
        run: ./gradlew :core:testDebugUnitTest --console=plain

      - name: Build APKs and App Bundles
        run: >
          ./gradlew --console=plain
          :mobile:assembleRelease :mobile:bundleRelease
          :tv:assembleRelease :tv:bundleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          V=${{ steps.version.outputs.name }}
          mkdir -p ../dist ../dist-extra
          cp mobile/build/outputs/apk/release/mobile-release.apk "../dist/AWGConnect-$V-android.apk"
          cp tv/build/outputs/apk/release/tv-release.apk "../dist/AWGConnect-$V-androidtv.apk"
          # Bundles and R8 mappings are for store upload / crash deobfuscation, not end users.
          cp mobile/build/outputs/bundle/release/mobile-release.aab "../dist-extra/AWGConnect-$V-android.aab"
          cp tv/build/outputs/bundle/release/tv-release.aab "../dist-extra/AWGConnect-$V-androidtv.aab"
          cp mobile/build/outputs/mapping/release/mapping.txt "../dist-extra/mapping-android-$V.txt"
          cp tv/build/outputs/mapping/release/mapping.txt "../dist-extra/mapping-androidtv-$V.txt"
          rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-store-bundles
          path: dist-extra/
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          # Same scheme as Android: 1.2.3 -> 1002003.
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v5
        with:
          go-version-file: Vendor/WireGuardKit/Sources/WireGuardKitGo/go.mod
          cache-dependency-path: Vendor/WireGuardKit/Sources/WireGuardKitGo/go.sum

      - name: Import signing certificate and profiles
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ secrets.MACOS_TUNNEL_PROFILE_BASE64 }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$APP_PROFILE_BASE64" || -z "$TUNNEL_PROFILE_BASE64" ]]; then
            echo "::error::macOS signing secrets are missing. See docs/RELEASING.md."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')"
          [[ -n "$IDENTITY" ]] || { echo "::error::No signing identity in MACOS_CERTIFICATE_P12_BASE64"; exit 1; }
          echo "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
          echo "$TUNNEL_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.provisionprofile"
          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "APP_PROFILE=$RUNNER_TEMP/app.provisionprofile"
            echo "TUNNEL_PROFILE=$RUNNER_TEMP/tunnel.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          # Optional: only a Developer ID build can be notarized.
          if [[ -n "$NOTARY_KEY_BASE64" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]]; then
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Test
        run: swift test

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./scripts/macos-dmg.sh

      - name: Clean up signing material
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/*.provisionprofile "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/
          if-no-files-found: error

  # iOS: add a job once there is a distribution route (App Store / TestFlight). It needs a
  # distribution certificate + provisioning profiles (app and tunnel extension) as secrets.

  publish:
    name: Publish GitHub Release
    needs: [android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer*"
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "AWG Connect ${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
