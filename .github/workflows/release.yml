name: Release

# Pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) builds signed
# installers and publishes them as a GitHub Release. Tags with a suffix (v1.2.0-beta.1)
# are published as pre-releases.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android (phone + TV)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: AmneziaAndroid
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]} MINOR=${BASH_REMATCH[2]} PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 999 || PATCH > 999 )); then
            echo "::error::Minor and patch must be <= 999 to fit the versionCode scheme"
            exit 1
          fi
          # Monotonic Play-compatible code: 1.2.3 -> 1002003. Pre-releases share their
          # base version's code, so only one of them can ever be uploaded to a store.
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test
        run: ./gradlew :core:testDebugUnitTest --console=plain

      - name: Build APKs and App Bundles
        run: >
          ./gradlew --console=plain
          :mobile:assembleRelease :mobile:bundleRelease
          :tv:assembleRelease :tv:bundleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          V=${{ steps.version.outputs.name }}
          mkdir -p ../dist ../dist-extra
          cp mobile/build/outputs/apk/release/mobile-release.apk "../dist/AWGConnect-$V-android.apk"
          cp tv/build/outputs/apk/release/tv-release.apk "../dist/AWGConnect-$V-androidtv.apk"
          # Bundles and R8 mappings are for store upload / crash deobfuscation, not end users.
          cp mobile/build/outputs/bundle/release/mobile-release.aab "../dist-extra/AWGConnect-$V-android.aab"
          cp tv/build/outputs/bundle/release/tv-release.aab "../dist-extra/AWGConnect-$V-androidtv.aab"
          cp mobile/build/outputs/mapping/release/mapping.txt "../dist-extra/mapping-android-$V.txt"
          cp tv/build/outputs/mapping/release/mapping.txt "../dist-extra/mapping-androidtv-$V.txt"
          rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-store-bundles
          path: dist-extra/
          if-no-files-found: error

  # iOS / macOS: add a job here once the Apple Developer account is active. It needs a
  # distribution certificate + provisioning profiles (app and tunnel extension) as secrets,
  # then `xcodebuild archive` and `-exportArchive` to produce the .ipa / notarized .app.

  publish:
    name: Publish GitHub Release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-installers
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "AWG Connect ${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
